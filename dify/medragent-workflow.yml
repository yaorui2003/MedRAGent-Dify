    - data:
        code: "import json\nimport re\n\ndef main(items: list, total: int) -> dict:\n\
          \    rows = []\n    included = 0\n    analyzed = 0\n    for raw in items:\n\
          \        raw = str(raw)\n        raw = re.sub(r\"(?s)<!--.*?-->\", \"\"\
          , raw)\n        idx = raw.rfind(\"</think\")\n        if idx != -1:\n  \
          \          end = raw.find(\">\", idx)\n            raw = raw[end + 1:] if\
          \ end != -1 else raw[idx + len(\"</think\"):]\n        else:\n         \
          \   raw = re.sub(r\"(?s)^.*?<think[^>]*>\", \"\", raw)\n        data = None\n\
          \        try:\n            data = json.loads(raw)\n        except Exception:\n\
          \            start = raw.find(\"{\")\n            end = raw.rfind(\"}\"\
          )\n            if start >= 0 and end > start:\n                try:\n  \
          \                  data = json.loads(raw[start:end + 1])\n             \
          \   except Exception:\n                    data = None\n        if not isinstance(data,\
          \ dict):\n            rows.append({\"relevant\": \"parse_error\", \"pmid\"\
          : \"\", \"title\": raw[:80], \"exclusion_reasons\": \"parse_error\"})\n\
          \            continue\n        relevant = data.get(\"relevant\", False)\n\
          \        reasons = data.get(\"reasons\") or {}\n        if not isinstance(reasons,\
          \ dict):\n            reasons = {}\n        meta = data.get(\"metadata\"\
          , {}) or {}\n        if relevant is True:\n            included += 1\n \
          \       analyzed += 1\n        rows.append({\n            \"pmid\": str(meta.get(\"\
          pmid\", \"\")),\n            \"title\": meta.get(\"title\", \"\"),\n   \
          \         \"included\": \"YES\" if relevant is True else \"NO\",\n     \
          \       \"population\": reasons.get(\"population_match\", \"\"),\n     \
          \       \"intervention\": reasons.get(\"intervention_match\", \"\"),\n \
          \           \"comparison\": reasons.get(\"comparison_match\", \"\"),\n \
          \           \"outcome\": reasons.get(\"outcome_match\", \"\"),\n       \
          \     \"study_design\": reasons.get(\"study_design\", \"\"),\n         \
          \   \"exclusion_reasons\": \"; \".join(r for r in reasons.get(\"exclusion_reasons\"\
          , []) if r),\n        })\n    return {\"rows\": rows, \"included\": included,\
          \ \"analyzed\": analyzed, \"total\": total}"
