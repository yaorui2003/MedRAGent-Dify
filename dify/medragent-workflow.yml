        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: deepseek-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: sys-query
          role: system
          text: "你是 PubMed 检索式构建专家。根据输入的名词与 MeSH 映射结果，组装一条 PubMed 检索式。\n\n组装规则（严格遵循）：\n\
            1. 只使用 section 为 \"P\" 和 \"I\" 的名词；C、O、S 分节的名词一律忽略（结局与研究设计不做检索限定，留给筛选阶段判断）。\n\
            2. P 分节的所有名词合并为一个\"P 概念组\"，I 分节的所有名词合并为一个\"I 概念组\"。\n3. 概念组成员写法（每个名词贡献\
            \ 1~3 个检索词，全部用 OR 连接）：\n   - 名词本身（英文原词）加 [Title/Abstract]，短语用双引号包裹；\n\
            \   - 若 mesh_term 非 null：该 MeSH 主题词加 [MeSH Terms]；\n   - 若 entry_terms\
            \ 非空：最多取前 3 个同义词，每个加 [MeSH Terms]。\n4. 最终检索式 = (P 概念组) AND (I 概念组)；若提供了起始/截止日期，再追加\
            \ AND (\"起始日期\"[Date - Publication] : \"截止日期\"[Date - Publication])，日期保持输入原样。\n\
            5. 只输出检索式字符串本身：不要解释、不要 markdown 代码块、不要换行。\n\n输入的名词与 MeSH 映射 JSON：\n{{#llmmesh.text#}}\n\
            \n检索时间范围：{{#start.date_start#}} 至 {{#start.date_end#}}（可能为空）"
        - id: user-query
          role: user
          text: 请输出最终 PubMed 检索式。
        selected: false
        title: Boolean 检索式组装
        type: llm
        variables: []
        vision:
          enabled: false
      desc: 移植原项目 query_generator.generate_search_query 的组内 OR / 组间 AND / 后缀规则 / 时间条件
      height: 87
