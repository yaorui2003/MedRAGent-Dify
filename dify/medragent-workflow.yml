        prompt_template:
        - id: sys-mesh
          role: system
          text: "你是医学文献检索专家（MeSH 标引方向）。基于下面提供的 MeSH 主题词库摘录完成两项任务：\n\n1. 名词抽取：从用户给出的\
            \ PICOS 标准中，只抽取 P（人群/疾病）和 I（干预/暴露）两个分节的名词；C、O、S 分节一律忽略。\n   - 按\"可独立检索的医学概念\"\
            粒度拆分，不要保留长复合短语。例如 \"fasting during Ramadan\" 拆成 \"fasting\" 和 \"Ramadan\"\
            ；\"adolescent with type 1 diabetes\" 拆成 \"adolescent\" 和 \"type 1 diabetes\
            \ mellitus\"。\n   - 医学缩写请展开（T1DM -> Type 1 Diabetes Mellitus）。\n2. MeSH\
            \ 映射：为每个概念从摘录中找出最匹配的 MeSH 规范主题词（即摘录中 \"### Term:\" 后的名称）。\n   - 只允许使用摘录中出现的主题词；摘录中没有合适匹配时置为\
            \ null；\n   - 如果摘录中该主题词带有 Entry Terms（同义词），原样记住，供下一步组装检索式使用。\n\n只输出严格\
            \ JSON（不要任何其他文字、不要 markdown 代码块）：\n{\"nouns\": [{\"noun\": \"...\", \"\
            section\": \"P\", \"mesh_term\": \"...\" 或 null, \"entry_terms\": [\"\
            ...\"]}]}\n\nMeSH 主题词库摘录：\n{{#context#}}"
        - id: user-mesh
          role: user
          text: '{{#start.picos#}}'
        selected: false
        title: PICOS 解析与 MeSH 映射
        type: llm
        variables: []
        vision:
          enabled: false
      desc: 移植原项目 extract_nouns + FAISS MeSH 检索 + NLM 同义词扩展 -> Dify 知识检索 + LLM
      height: 87
