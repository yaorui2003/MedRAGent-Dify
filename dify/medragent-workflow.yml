    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: []
          type: none
        headers: 'User-Agent: medragent-dify/1.0'
        method: get
        params: 'db: pubmed

          id: {{#codeesearch.ids#}}

          rettype: medline

          retmode: text'
        retry_config:
          max_retries: 3
          retry_interval: 1000
        selected: false
        ssl_verify: true
        timeout:
          connect: 10
          max_connect_timeout: 60
          max_read_timeout: 60
          max_write_timeout: 60
          read: 60
          write: 60
        title: PubMed efetch
        type: http-request
        url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi
      desc: 按 PMID 批量取 MEDLINE 纯文本（标题/摘要/期刊/日期），规避沙箱 XML 依赖
      height: 107
      id: httpfetch
      position:
        x: 2388
        y: 52.5
      positionAbsolute:
        x: 2388
        y: 52.5
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
      zIndex: 0
    - data:
        code: "def main(raw: str) -> dict:\n    \"\"\"Parse PubMed MEDLINE tagged\
          \ text into article dicts.\\n\\n    Tag lines: 4-char tag + '-' + space\
          \ (e.g. 'PMID- 123', 'TI  - ...');\\n    continuation lines are indented;\
          \ records start with PMID-.\"\"\"\n    records = []\n    cur = {}\n    last\
          \ = None\n    for line in raw.splitlines():\n        if len(line) >= 6 and\
          \ line[4] == '-' and line[5] == ' ' and line[:4].strip():\n            tag\
          \ = line[:4].strip()\n            val = line[6:].strip()\n            if\
          \ tag == \"PMID\":\n                if cur:\n                    records.append(cur)\n\
          \                cur = {}\n            if cur is None:\n               \
          \ cur = {}\n            cur.setdefault(tag, [])\n            cur[tag].append(val)\n\
          \            last = tag\n        elif line.strip() and cur and last:\n \
          \           cur[last][-1] += \" \" + line.strip()\n    if cur:\n       \
          \ records.append(cur)\n\n    articles = []\n    for r in records:\n    \
          \    abstract = \" \".join(r.get(\"AB\", [])) or \"no abstract\"\n     \
          \   articles.append({\n            \"pmid\": r.get(\"PMID\", [\"\"])[0].strip(),\n\
          \            \"title\": r.get(\"TI\", [\"no title\"])[0],\n            \"\
          abstract\": abstract,\n            \"journal\": r.get(\"JT\", [\"\"])[0],\n\
          \            \"pub_year\": r.get(\"DP\", [\"\"])[0][:4],\n        })\n \
          \   return {\"articles\": articles, \"total\": len(records)}"
        code_language: python3
        outputs:
          articles:
            children: null
            type: array[object]
          total:
            children: null
            type: number
        selected: false
        title: 解析文献列表
        type: code
        variables:
        - value_selector:
          - httpfetch
          - body
          variable: raw
      desc: MEDLINE 标签文本 -> 结构化文献数组（纯字符串解析，沙箱安全）
      height: 51
      id: codemedline
      position:
        x: 2729
        y: 80.5
      positionAbsolute:
        x: 2729
        y: 80.5
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
      zIndex: 0
