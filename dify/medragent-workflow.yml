        title: PubMed esearch
        type: http-request
        url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi
      desc: 直连 NCBI E-utilities：Boolean 检索式 -> 总数 + PMID 列表（JSON）
      height: 107
      id: httpesearch
      position:
        x: 1706
        y: 52.5
      positionAbsolute:
        x: 1706
        y: 52.5
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
      zIndex: 0
    - data:
        code: "import json\n\ndef main(raw: str, max_results) -> dict:\n    \"\"\"\
          Parse esearch JSON: total count + PMID list (deduplicated, capped).\"\"\"\
          \n    try:\n        data = json.loads(raw)\n    except Exception:\n    \
          \    return {\"total\": 0, \"ids\": \"\", \"fetched\": 0}\n    result =\
          \ data.get(\"esearchresult\", {})\n    total = int(result.get(\"count\"\
          , 0))\n    pmids = list(dict.fromkeys(result.get(\"idlist\", [])))\n   \
          \ try:\n        cap = int(max_results) if max_results else 20\n    except\
          \ Exception:\n        cap = 20\n    pmids = pmids[:cap]\n    return {\"\
          total\": total, \"ids\": \",\".join(pmids), \"fetched\": len(pmids)}"
        code_language: python3
        outputs:
          fetched:
            children: null
            type: number
          ids:
            children: null
            type: string
          total:
            children: null
            type: number
        selected: false
        title: 解析检索结果
        type: code
        variables:
        - value_selector:
          - httpesearch
          - body
          variable: raw
        - value_selector:
          - start
          - max_results
          variable: max_results
      desc: esearch JSON -> 总数 + 逗号分隔 PMID 串（供 efetch 批量拉取）
      height: 51
      id: codeesearch
      position:
        x: 2047
