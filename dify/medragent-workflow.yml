            : \"...\",\n   \"outcome_match\": \"...\",\n   \"study_design\": \"...\"\
            ,\n   \"exclusion_reasons\": [\"Reason 1: ...\", \"Reason 2: ...\"]\n\
            \ },\n \"metadata\": {\"pmid\": 文献中的 pmid, \"title\": 文献中的 title}}\n\n\
            待判定文献（JSON，含 pmid/title/abstract/journal/pub_year）：\n{{#iterscreen.item#}}\n\
            \n注意：若 abstract 为 \"no abstract\"，直接 relevant=false 且 exclusion_reasons\
            \ 填 [\"no abstract\"]。"
