    - data:
        context:
          enabled: false
          variable_selector: []
        isInIteration: true
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: deepseek-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: sys-screen
          role: system
          text: "你是一名资深生物统计学家，负责系统综述的文献筛选。按以下规则判定给定文献是否应纳入。\n\n文献筛选规则说明：\n1. 纳入标准处理原则：\n\
            \   - 全部纳入标准均满足 -> 纳入该文献\n   - 摘要与标题中含明确支持性描述 -> 视为该纳入标准满足\n   - 摘要与标题中含明确否定性描述\
            \ -> 视为该纳入标准不满足\n   - 摘要与标题中未找到明确支持/否定描述 -> 视为该纳入标准满足\n2. 排除标准处理原则：\n\
            \   - 满足任一排除标准 -> 排除该文献\n   - 摘要与标题中含明确支持性描述 -> 视为该排除标准满足\n   - 摘要与标题中含明确否定性描述\
            \ -> 视为该排除标准不满足\n   - 摘要与标题中未找到明确支持/否定描述 -> 视为该排除标准不满足\n\n判定标准：\n纳入标准（PICOS）：\n\
            {{#start.picos#}}\n\n排除标准：\n{{#start.exclusion#}}\n\n分析步骤：\n1. 逐条核对纳入标准：在摘要与标题中寻找支持性/否定性描述，按纳入标准处理原则判定；\n\
            2. 逐条核对排除标准：在摘要与标题中寻找支持性/否定性描述，按排除标准处理原则判定；\n3. 最终判定：\n   - 全部纳入标准满足且无排除标准满足\
            \ -> 纳入 (relevant=true)\n   - 任一纳入标准不满足 -> 排除 (relevant=false)\n   - 任一排除标准满足\
            \ -> 排除 (relevant=false)\n\n只输出严格 JSON（不要任何其他文字、不要 markdown 代码块），用英文填写理由字段：\n\
            {\"relevant\": true/false,\n \"reasons\": {\n   \"population_match\":\
