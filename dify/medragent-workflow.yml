        flatten_output: true
        height: 207
        is_parallel: true
        iterator_selector:
        - codemedline
        - articles
        output_selector:
        - llmscreen
        - text
        output_type: array[string]
        parallel_nums: 4
        selected: false
        start_node_id: iterscreenstart0
        title: 逐篇筛选（迭代）
        type: iteration
        width: 517
      desc: 对每篇文献调用 LLM 按 PICOS 纳入/排除标准判定，移植原项目 analyze_articles
      height: 207
      id: iterscreen
