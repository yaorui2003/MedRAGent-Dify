app:
  description: render test B iteration
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: workflow
  name: render-test-b
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: iteration
      id: e1
      source: start
      sourceHandle: source
      target: iter
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: true
        sourceType: iteration-start
        targetType: llm
      id: e2
      source: iter-start
      sourceHandle: source
      target: llm-screen
      targetHandle: target
      type: custom
      zIndex: 1002
    - data:
        isInIteration: false
        sourceType: iteration
        targetType: end
      id: e3
      source: iter
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        title: 开始
        type: start
        variables: []
      height: 90
      id: start
      position: {x: 30, y: 300}
      positionAbsolute: {x: 30, y: 300}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        iterator_input_type: array
        output_selector:
        - llm-screen
        - text
        start_node_id: iter-start
        title: 迭代测试
        type: iteration
      height: 200
      id: iter
      position: {x: 330, y: 260}
      positionAbsolute: {x: 330, y: 260}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 500
      zIndex: 1
    - data:
        isInIteration: true
        selected: false
        title: 迭代开始
        type: iteration-start
      height: 90
      id: iter-start
      parentId: iter
      position: {x: 40, y: 80}
      positionAbsolute: {x: 370, y: 340}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 180
      zIndex: 1002
    - data:
        context:
          enabled: false
          variable_selector: []
        isInIteration: true
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: deepseek-flash
          provider: deepseek
        prompt_template:
        - id: sys
          role: system
          text: 测试
        - id: user
          role: user
          text: '{{#iter.item#}}'
        selected: false
        title: 内部LLM
        type: llm
        variables: []
        vision:
          enabled: false
      height: 90
      id: llm-screen
      parentId: iter
      position: {x: 260, y: 80}
      positionAbsolute: {x: 590, y: 340}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      zIndex: 1002
    - data:
        outputs:
        - value_selector:
          - iter
          - output
          variable: out
        title: 结束
        type: end
      height: 90
      id: end
      position: {x: 900, y: 300}
      positionAbsolute: {x: 900, y: 300}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
  hash: ''
